# ----------------------------------------------------------
# Author: Nandan Kumar
# Assignment-11: CI/CD Pipeline 
# File: .github/workflows/test.yml
# ----------------------------------------------------------
# Description:
#   • Runs unit + integration tests with PostgreSQL
#   • Enforces coverage ≥ 90%
#   • Excludes E2E tests from CI
#   • Performs Trivy security scan
#   • Builds & pushes Docker image to Docker Hub (main branch only)
# ----------------------------------------------------------

name: Assignment 11 - Calculation Model CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:

  # --------------------------------------------------------
  # 1. TEST JOB — Unit + Integration Tests (≥ 90% Coverage)
  # --------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ps_user
          POSTGRES_PASSWORD: ps_password
          POSTGRES_DB: calc_m11_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ps_user -d calc_m11_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        env:
          DATABASE_URL: postgresql://ps_user:ps_password@localhost:5432/calc_m11_db
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U ps_user -d calc_m11_db && break
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: Run Tests (exclude E2E, enforce ≥90% coverage)
        env:
          DATABASE_URL: postgresql://ps_user:ps_password@localhost:5432/calc_m11_db
          TEST_DATABASE_URL: postgresql://ps_user:ps_password@localhost:5432/test_db
        run: |
          source venv/bin/activate
          pytest -m "not e2e" \
            --cov=app --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -v --disable-warnings

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # --------------------------------------------------------
  # 2. SECURITY JOB — Trivy Vulnerability Scan
  # --------------------------------------------------------
  security:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image for Scanning
        run: docker build -t module11_test_calculation_model:img_m11 .

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: module11_test_calculation_model:img_m11
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # --------------------------------------------------------
  # 3. DEPLOY JOB — Push to Docker Hub (Main Only)
  # --------------------------------------------------------
  deploy:
    needs: security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image (img_m11)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            nandanksingh/module11_test_calculation_model:img_m11
            nandanksingh/module11_test_calculation_model:${{ github.sha }}

      - name: Verify Push
        run: docker pull nandanksingh/module11_test_calculation_model:img_m11
