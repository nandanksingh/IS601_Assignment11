# ----------------------------------------------------------
# Author: Nandan Kumar
# Assignment-11: Full Docker Compose Stack
# File: docker-compose.yml
# ----------------------------------------------------------
# Description:
#   • Orchestrates the Calculator Project stack:
#       - FastAPI Application
#       - PostgreSQL Database
#       - pgAdmin Web UI
#       - Playwright E2E Test Runner
#   • Ensures correct startup order using health checks
#   • E2E tests bypass pytest-cov to avoid coverage failures
#   • Local pytest.ini still enforces >90% coverage (NOT in Docker)
# ----------------------------------------------------------

name: module11_calculation_model_project

services:

  # --------------------------------------------------------
  # FastAPI Application
  # --------------------------------------------------------
  app:
    container_name: module11_app
    build:
      context: .
      dockerfile: Dockerfile
    image: module11_calculation_model:img11
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - m11_net

  # --------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------
  db:
    container_name: module11_postgres
    image: postgres:15
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - m11_net

  # --------------------------------------------------------
  # pgAdmin Web UI (Database Management)
  # --------------------------------------------------------
  pgadmin:
    container_name: module11_pgadmin
    image: dpage/pgadmin4
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "5050:80"
    volumes:
      - pgadmin_volume:/var/lib/pgadmin
    networks:
      - m11_net

  # --------------------------------------------------------
  # Playwright E2E Test Runner
  # --------------------------------------------------------
  tests:
    container_name: module11_tests
    build:
      context: .
      dockerfile: Dockerfile
    image: module11_calculation_model_tests:img11
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/test_db
      BASE_URL: "http://app:8000"
      PLAYWRIGHT_BROWSERS_PATH: "/home/appuser/.cache/ms-playwright"
    command: >
      bash -c "
        export PGPASSWORD=${POSTGRES_PASSWORD};
        until pg_isready -h db -U ${POSTGRES_USER} >/dev/null 2>&1; do sleep 2; done;

        # Disable coverage plugins + wipe pytest.ini coverage options
        export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1;
        export PYTEST_ADDOPTS=;

        pytest -m 'e2e' -q
      "
    networks:
      - m11_net

# --------------------------------------------------------
# Persistent Volumes
# --------------------------------------------------------
volumes:
  pgdata:
  pgadmin_volume:

# --------------------------------------------------------
# Shared Network
# --------------------------------------------------------
networks:
  m11_net:
    driver: bridge
