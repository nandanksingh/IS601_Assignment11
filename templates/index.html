     File: templates/index.html
 ---------------------------------------------------------------
 Description:
 • Fully animated login & calculator interface
 • Smooth fade transitions between screens
 • Secure JWT-based login with redirect
 • Calculator supports add, subtract, multiply, divide
 • Stylish glassmorphism UI with gradient background
 • Glow animation on successful login
 • Custom error handling (e.g., divide by zero)
 -------------------------------------------------------------- -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>FastAPI Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* ==========================================================
       Global Background Animation
       ========================================================== */
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0a4d7a, #0e6fa8, #13a7c7, #17c7e8);
      background-size: 200% 200%;
      animation: shiftGradient 8s ease infinite;
      overflow: hidden;
      color: #ffffff;
    }

    @keyframes shiftGradient {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* ==========================================================
       Fade Animations
       ========================================================== */
    .fade-out {
      animation: fadeOut 0.6s forwards;
    }

    .fade-in {
      animation: fadeIn 0.7s forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translateY(-20px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================================
       Glow Animation (Success Login)
       ========================================================== */
    .success-glow {
      animation: glowEffect 1.2s ease-out;
    }

    @keyframes glowEffect {
      0% {
        box-shadow: 0 0 0 rgba(0, 255, 120, 0);
      }

      40% {
        box-shadow: 0 0 25px rgba(0, 255, 120, 0.9);
      }

      100% {
        box-shadow: 0 0 0 rgba(0, 255, 120, 0);
      }
    }

    /* ==========================================================
       Card (Glassmorphism Panels)
       ========================================================== */
    .card {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(15px);
      border-radius: 22px;
      padding: 40px 50px;
      width: 420px;
      text-align: center;
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.25),
        inset 0 0 25px rgba(255, 255, 255, 0.18);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* ==========================================================
       Input Styling
       ========================================================== */
    input {
      width: 85%;
      padding: 12px;
      margin: 10px 0;
      font-size: 17px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.55);
      text-align: center;
      transition: 0.25s;
    }

    input:focus {
      outline: none;
      border-color: white;
      box-shadow: 0 0 8px white;
    }

    /* ==========================================================
       Button Styling
       ========================================================== */
    button {
      margin: 8px;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
    }

    #loginBtn {
      background: #2196f3;
      width: 100%;
    }

    #logoutBtn {
      background: #ff4444;
      width: 100%;
      margin-top: 20px;
    }

    #add {
      background: #28d17c;
    }

    #subtract {
      background: #ffb74d;
    }

    #multiply {
      background: #7e57c2;
    }

    #divide {
      background: #ef5350;
    }

    button:hover {
      transform: scale(1.07);
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.8);
    }

    /* ==========================================================
       Result Box
       ========================================================== */
    #result {
      margin-top: 20px;
      padding: 14px;
      font-size: 22px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 14px;
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.4);
      min-height: 32px;
    }
  </style>
</head>

<body>

  <!-- ==========================================================
       LOGIN PANEL
       ========================================================== -->
  <div class="card" id="loginCard">
    <h1>Login</h1>

    <input type="text" id="loginUser" placeholder="Username or Email" />
    <input type="password" id="loginPass" placeholder="Password" />

    <button id="loginBtn" onclick="login()">Login</button>

    <div id="loginMsg" style="margin-top: 12px; font-size: 17px; font-weight: bold;"></div>
  </div>

  <!-- ==========================================================
       CALCULATOR PANEL
       ========================================================== -->
  <div class="card fade-in" id="calcCard" style="display:none;">
    <h1>Calculator</h1>

    <input type="text" id="a" placeholder="First number" />
    <input type="text" id="b" placeholder="Second number" />

    <button id="add" onclick="calculate('add')">Add</button>
    <button id="subtract" onclick="calculate('subtract')">Subtract</button>
    <button id="multiply" onclick="calculate('multiply')">Multiply</button>
    <button id="divide" onclick="calculate('divide')">Divide</button>

    <div id="result"></div>

    <button id="logoutBtn" onclick="logout()">Logout</button>
  </div>

  <!-- ==========================================================
       JAVASCRIPT LOGIC
       ========================================================== -->
  <script>
    /* ----------------------------------------------------------
       LOGIN ACTION
       ---------------------------------------------------------- */
    async function login() {
      const user = document.getElementById("loginUser").value.trim();
      const pass = document.getElementById("loginPass").value.trim();
      const msg = document.getElementById("loginMsg");

      if (!user || !pass) {
        msg.innerText = "Please enter both fields.";
        msg.style.color = "#ffcccc";
        return;
      }

      try {
        const res = await fetch("http://localhost:8000/auth/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: user, password: pass })
        });

        const data = await res.json();

        if (res.ok) {
          msg.innerText = "Login successful!";
          msg.style.color = "#00ff99";

          document.getElementById("loginCard").classList.add("success-glow");
          localStorage.setItem("token", data.access_token);

          setTimeout(() => {
            document.getElementById("loginCard").classList.add("fade-out");
            setTimeout(() => {
              document.getElementById("loginCard").style.display = "none";
              document.getElementById("calcCard").style.display = "block";
              document.getElementById("calcCard").classList.add("fade-in");
            }, 500);
          }, 600);

        } else {
          msg.innerText = data.detail || "Login failed";
          msg.style.color = "#ff5555";
        }

      } catch (err) {
        msg.innerText = "Server error";
        msg.style.color = "#ff5555";
      }
    }

    /* ----------------------------------------------------------
       LOGOUT ACTION (Updated with Message)
       ---------------------------------------------------------- */
    function logout() {
      localStorage.removeItem("token");

      const msg = document.getElementById("loginMsg");
      msg.innerText = "You’ve been logged out. See you next time! 👋";
      msg.style.color = "#ffdd88";

      // Fade out calculator
      document.getElementById("calcCard").classList.add("fade-out");

      setTimeout(() => {
        document.getElementById("calcCard").style.display = "none";
        document.getElementById("loginCard").style.display = "block";
        document.getElementById("loginCard").classList.add("fade-in");

        // Clear logout message after delay
        setTimeout(() => {
          msg.innerText = "";
        }, 3000);

      }, 500);
    }

    /* ----------------------------------------------------------
       CALCULATOR ACTIONS
       ---------------------------------------------------------- */
    async function calculate(operation) {
      const token = localStorage.getItem("token");
      const a = document.getElementById("a").value.trim();
      const b = document.getElementById("b").value.trim();
      const resultBox = document.getElementById("result");

      if (!a || !b) {
        resultBox.innerText = "Result: Missing inputs.";
        return;
      }

      try {
        const res = await fetch("http://localhost:8000/calc/compute", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ type: operation, a: Number(a), b: Number(b) })
        });

        const data = await res.json();

        if (res.ok) {
          resultBox.innerText = "Result: " + data.result;
        } else {
          let error = data.detail || data.error || "Error";

          if (error.toLowerCase().includes("zero")) {
            error = "Cannot divide by zero";
          }

          resultBox.innerText = "Result: " + error;
        }

      } catch {
        resultBox.innerText = "Result: Server error.";
      }
    }
  </script>

</body>

</html>
