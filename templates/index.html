<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>FastAPI Calculator</title>

  <!-- Modern Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f2f4f7;
      font-family: "Inter", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #ffffff;
      width: 420px;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
      font-weight: 600;
      font-size: 28px;
      color: #222;
    }

    input {
      width: 140px;
      padding: 10px;
      font-size: 16px;
      margin: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    input:focus {
      border-color: #007bff;
      box-shadow: 0 0 4px rgba(0, 123, 255, 0.4);
    }

    .btn-row {
      margin-top: 15px;
    }

    button {
      padding: 10px 18px;
      margin: 5px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .add {
      background-color: #007bff;
    }

    .subtract {
      background-color: #6f42c1;
    }

    .multiply {
      background-color: #28a745;
    }

    .divide {
      background-color: #e5533d;
    }

    #result {
      margin-top: 20px;
      min-height: 28px;
      font-size: 20px;
      font-weight: 600;
      color: #333;
    }

    #result.error {
      color: #d9534f;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>FastAPI Calculator</h1>

    <input id="a" placeholder="First number">
    <input id="b" placeholder="Second number">

    <div class="btn-row">
      <button class="add" onclick="calculate('add')">Add</button>
      <button class="subtract" onclick="calculate('subtract')">Subtract</button>
      <button class="multiply" onclick="calculate('multiply')">Multiply</button>
      <button class="divide" onclick="calculate('divide')">Divide</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    async function calculate(op) {
      const a = document.getElementById("a").value.trim();
      const b = document.getElementById("b").value.trim();
      const resultBox = document.getElementById("result");

      resultBox.classList.remove("error");

      // Basic validation
      if (a === "" || b === "" || isNaN(a) || isNaN(b)) {
        resultBox.classList.add("error");
        resultBox.innerText = "Error: Enter valid numbers.";
        return;
      }

      try {
        const res = await fetch("/calc/compute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            type: op,
            a: parseFloat(a),
            b: parseFloat(b)
          }),
        });

        let data;
        try {
          data = await res.json();
        } catch {
          resultBox.classList.add("error");
          resultBox.innerText = "Error: Invalid server response.";
          return;
        }

        // Handle validation errors cleanly
        if (!res.ok) {
          let msg = "Unknown error";

          if (Array.isArray(data.detail)) {
            msg = data.detail[0].msg || "Invalid input";
          } else if (typeof data.detail === "string") {
            msg = data.detail;
          } else if (data.error) {
            msg = data.error;
          }

          resultBox.classList.add("error");
          resultBox.innerText = "Error: " + msg;
          return;
        }

        // SUCCESS
        resultBox.innerText = data.result;
      } catch (err) {
        resultBox.classList.add("error");
        resultBox.innerText = "Error: " + err.message;
      }
    }
  </script>
</body>

</html>
