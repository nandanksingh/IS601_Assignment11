# ----------------------------------------------------------
# Author: Nandan Kumar
# Date: 11/17/2025
# Assignment-11: Calculation Model + Factory Pattern
# File: pytest.ini
# ----------------------------------------------------------
# Description:
# Central pytest configuration for Assignment-11. Ensures:
#   • Minimum 90% test coverage
#   • Clean reporting (terminal + HTML)
#   • Discovers all tests automatically
#   • Skips E2E tests from coverage
#   • Allows running E2E separately without failing coverage
#   • Loads .env automatically
# ----------------------------------------------------------

[pytest]

# -------------------------------
# Test Discovery
# -------------------------------
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# -------------------------------
# Coverage for unit + integration
# -------------------------------
addopts =
    -v
    --disable-warnings
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=90

# -------------------------------
# Coverage Omission Rules
# -------------------------------
[coverage:run]
omit =
    tests/e2e/*
    tests/conftest.py
    */__init__.py

# -------------------------------
# Markers
# -------------------------------
markers =
    fast: fast unit tests
    slow: slow tests
    e2e: end-to-end tests (excluded from coverage)

# -------------------------------
# Warnings / Logging
# -------------------------------
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

log_cli = true
log_level = INFO

# -------------------------------
# Load environment variables
# -------------------------------
env_files = .env
