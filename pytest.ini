# ----------------------------------------------------------
# Author: Nandan Kumar
# Assignment-11: Central Pytest Configuration
# File: pytest.ini
# ----------------------------------------------------------
# Description:
#   • Enforces minimum 90% coverage
#   • Excludes E2E tests from coverage
#   • Provides clean reporting (terminal + HTML)
#   • Auto-discovers tests
#   • Loads environment variables from .env
# ----------------------------------------------------------

[pytest]

# -------------------------------
# Test Discovery
# -------------------------------
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# -------------------------------
# Coverage Settings
# -------------------------------
addopts =
    -v
    --disable-warnings
    -m "not e2e"
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=90

# -------------------------------
# Coverage Omission Rules
# -------------------------------
[coverage:run]
omit =
    tests/e2e/*
    tests/conftest.py
    */__init__.py

[coverage:report]
ignore_errors = True

# -------------------------------
# Markers
# -------------------------------
markers =
    fast: fast unit tests
    slow: slow tests
    e2e: end-to-end tests (excluded from coverage)

# -------------------------------
# Warnings / Logging
# -------------------------------
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

log_cli = true
log_level = INFO

# -------------------------------
# Load environment variables
# -------------------------------
env_files = .env
