# ----------------------------------------------------------
# Author: Nandan Kumar
# Assignment-11: Central Pytest Configuration
# File: pytest.ini
# ----------------------------------------------------------
# Description:
#   • Enables coverage for unit + integration tests only
#   • Excludes E2E tests from coverage reports
#   • Enforces fail-under=90 for normal tests
#   • Allows manual E2E execution without coverage failures
# ----------------------------------------------------------

[pytest]

# ----------------------------------------------------------
# Test Discovery
# ----------------------------------------------------------
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# ----------------------------------------------------------
# Default Options (unit + integration tests)
# ----------------------------------------------------------
addopts =
    -v
    --disable-warnings
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=90

# ----------------------------------------------------------
# Custom Test Markers
# ----------------------------------------------------------
markers =
    e2e: end-to-end browser tests (coverage disabled)
    fast: fast-running tests
    slow: long-running tests

# ----------------------------------------------------------
# Warning Filters
# ----------------------------------------------------------
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# ----------------------------------------------------------
# Coverage Rules
# ----------------------------------------------------------
# E2E files excluded from all coverage reports.
[coverage:run]
omit =
    tests/e2e/*.py
    */__init__.py

# ----------------------------------------------------------
# Load environment variables
# ----------------------------------------------------------
env_files = .env
